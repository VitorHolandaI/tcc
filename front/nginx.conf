server {
    listen 80;
    server_name _;

    # Permitir Firebase Auth popup (Google Sign-In)
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Frontend - arquivos estaticos
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - rotas do React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api para o backend principal (remove o prefixo /api)
    location /api/ {
        proxy_pass http://main-api:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix redirects: rewrite any absolute Location header to relative /api path
        # This prevents http:// mixed content when behind HTTPS termination
        proxy_redirect http://main-api:8000/ /api/;
        proxy_redirect http://$http_host/ /api/;
        proxy_redirect https://$http_host/ /api/;

        # Timeouts para execucao de codigo (pode demorar)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Recording Service (WebSocket support para streaming)
    location /api/recording/ {
        proxy_pass http://recording-service:8001/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts longos para streaming
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Analysis Service (gaze analysis)
    location /api/analysis/ {
        proxy_pass http://analysis-service:8002/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos para processamento de video
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Webcam Service (WebSocket support para streaming)
    location /api/webcam/ {
        proxy_pass http://webcam-service:8003/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts longos para streaming
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Audio Service (WebSocket support para streaming)
    location /api/audio/ {
        proxy_pass http://audio-service:8004/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts longos para streaming
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Keystroke Analysis Service
    location /api/keystroke/ {
        proxy_pass http://keystroke-service:8005/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Code Similarity Analysis Service
    location /api/similarity/ {
        proxy_pass http://similarity-service:8006/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
