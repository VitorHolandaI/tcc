name: Tests

on:
  push:
    branches: [main, security_fixing]
  pull_request:
    branches: [main]

jobs:
  backend-main:
    name: Main API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: back
        run: |
          uv venv .venv --python 3.11
          uv pip install -r requirements.txt

      - name: Run tests
        working-directory: back
        run: .venv/bin/python -m pytest tests/ -v --tb=short

  backend-keystroke:
    name: Keystroke Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: back/keystroke-service
        run: |
          uv venv .venv --python 3.11
          uv pip install -r requirements.txt

      - name: Run tests
        working-directory: back/keystroke-service
        run: .venv/bin/python -m pytest test_main.py -v --tb=short

  backend-similarity:
    name: Similarity Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: back/similarity-service
        run: |
          uv venv .venv --python 3.11
          uv pip install -r requirements.txt

      - name: Run tests
        working-directory: back/similarity-service
        run: .venv/bin/python -m pytest test_analyzer.py test_main.py -v --tb=short

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Build
        working-directory: front
        run: npm run build
