name: Tests

on:
  push:
    branches: [main, fix_comments]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Create venv and install dependencies
        working-directory: back
        run: |
          uv venv .venv --python 3.11
          uv pip install \
            -r similarity-service/requirements.txt \
            -r keystroke-service/requirements.txt \
            -r requirements.txt \
            --upgrade

      - name: Run Main API tests
        working-directory: back
        run: .venv/bin/python -m pytest tests/ -v --tb=short

      - name: Run Keystroke Service tests
        working-directory: back/keystroke-service
        run: ../.venv/bin/python -m pytest test_main.py -v --tb=short

      - name: Run Similarity Service tests
        working-directory: back/similarity-service
        run: ../.venv/bin/python -m pytest test_analyzer.py test_main.py -v --tb=short

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Build
        working-directory: front
        run: npm run build
